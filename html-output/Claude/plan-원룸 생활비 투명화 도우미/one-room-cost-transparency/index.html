<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="월세, 관리비, 공과금, 보증금 기회비용을 합쳐 원룸의 실제 주거비를 투명하게 보여주는 로컬 앱"
    />
    <title>원룸 생활비 투명화 도우미</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{--bg:#f5f5f7;--shell:#ffffff;--surface:#fafafa;--surface2:#f0f0f2;--red:#e60000;--red2:#ff4444;--dark:#1a1a1a;--mid:#666666;--muted:#999999;--border:#e0e0e0;--success:#00a86b;--warning:#ff8c00;--danger:#e60000;--grad:linear-gradient(135deg,#e60000,#ff4444);}
      *{box-sizing:border-box;}
      html,body{margin:0;min-height:100%;background:radial-gradient(circle at top left,rgba(230,0,0,0.12),transparent 32%),radial-gradient(circle at bottom right,rgba(255,68,68,0.1),transparent 28%),var(--bg);color:var(--dark);font-family:"Inter",sans-serif;}
      body{display:flex;justify-content:center;padding:0;}
      button,select,input,textarea{font:inherit;}
      button{cursor:pointer;}
      #phone{width:100%;max-width:430px;min-height:100dvh;background:linear-gradient(180deg,rgba(255,255,255,0.96),rgba(250,250,250,1)),var(--shell);display:flex;flex-direction:column;overflow:hidden;}
      #topbar{flex:0 0 auto;padding:18px 18px 14px;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(224,224,224,0.92);z-index:3;}
      #app{flex:1 1 auto;overflow-y:auto;padding:16px 16px 26px;background:radial-gradient(circle at 90% 0%,rgba(230,0,0,0.04),transparent 18%),linear-gradient(180deg,rgba(250,250,250,0.9),rgba(245,245,247,0.98));scroll-behavior:smooth;}
      #bottomnav{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,0.97);border-top:1px solid rgba(224,224,224,0.92);z-index:3;}
      @media (min-width:540px){body{padding:16px;}
      #phone{min-height:calc(100dvh - 32px);border-radius:28px;box-shadow:0 0 0 1px #e0e0e0,0 30px 60px rgba(0,0,0,0.12);}
      }
      #app::-webkit-scrollbar{width:8px;}
      #app::-webkit-scrollbar-thumb{background:rgba(153,153,153,0.38);border-radius:999px;}
      .topbar-row{display:flex;align-items:center;gap:10px;}
      .room-switch{flex:1;}
      .room-label{display:block;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:0.08em;color:var(--muted);text-transform:uppercase;}
      .room-select{width:100%;appearance:none;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,1),rgba(245,245,247,1)),var(--shell);padding:14px 42px 14px 14px;font-size:15px;font-weight:700;color:var(--dark);background-image:linear-gradient(45deg,transparent 50%,var(--red) 50%),linear-gradient(135deg,var(--red) 50%,transparent 50%),linear-gradient(180deg,rgba(255,255,255,1),rgba(245,245,247,1));background-position:calc(100% - 18px) 18px,calc(100% - 12px) 18px,0 0;background-size:6px 6px,6px 6px,100% 100%;background-repeat:no-repeat;}
      .ghost-btn,.primary-btn,.copy-btn{border:0;border-radius:16px;padding:13px 14px;font-weight:700;transition:transform 0.18s ease,opacity 0.18s ease;}
      .ghost-btn:active,.primary-btn:active,.copy-btn:active,.nav-btn:active{transform:scale(0.98);}
      .ghost-btn{background:var(--surface2);color:var(--dark);min-width:52px;}
      .primary-btn{background:var(--grad);color:#fff;width:100%;}
      .copy-btn{background:var(--surface2);color:var(--dark);}
      .top-meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
      .meta-pill,.badge,.mini-badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700;}
      .meta-pill{background:rgba(230,0,0,0.08);color:var(--red);}
      .badge{background:rgba(230,0,0,0.1);color:var(--red);}
      .mini-badge{background:var(--surface2);color:var(--mid);padding:5px 9px;}
      .tone-success{color:var(--success);}
      .tone-warning{color:var(--warning);}
      .tone-danger{color:var(--danger);}
      .tone-success-bg{background:rgba(0,168,107,0.12);color:var(--success);}
      .tone-warning-bg{background:rgba(255,140,0,0.12);color:var(--warning);}
      .tone-danger-bg{background:rgba(230,0,0,0.12);color:var(--danger);}
      .screen{display:flex;flex-direction:column;gap:14px;}
      .card,.hero-card,.score-card,.compare-card,.settle-hero{border:1px solid var(--border);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,1),rgba(250,250,250,1)),var(--shell);box-shadow:0 10px 24px rgba(0,0,0,0.04);}
      .card,.score-card,.compare-card{padding:16px;}
      .hero-card{padding:18px;background:radial-gradient(circle at top right,rgba(255,255,255,0.24),transparent 34%),var(--grad);color:#fff;box-shadow:0 18px 36px rgba(230,0,0,0.2);}
      .hero-tag,.card-kicker{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700;}
      .hero-tag{background:rgba(255,255,255,0.16);color:rgba(255,255,255,0.95);}
      .card-kicker{background:rgba(230,0,0,0.08);color:var(--red);}
      .hero-title,.settle-amount,.big-score{margin:14px 0 0;font-size:34px;line-height:1;font-weight:800;letter-spacing:-0.04em;}
      .hero-sub,.muted,.score-sub{margin:10px 0 0;color:rgba(255,255,255,0.86);font-size:14px;line-height:1.45;}
      .score-sub{color:var(--mid);}
      .hero-grid,.season-grid,.stats-grid,.input-grid{display:grid;gap:10px;}
      .season-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
      .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
      .input-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
      .season-box,.stat-box,.mini-box{border-radius:18px;background:rgba(255,255,255,0.88);border:1px solid rgba(255,255,255,0.72);padding:12px;}
      .season-label,.stat-label,.small-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;}
      .season-value,.stat-value,.mini-value{display:block;font-size:16px;font-weight:800;letter-spacing:-0.03em;color:var(--dark);}
      .hero-card .season-box,.hero-card .season-label,.hero-card .season-value{color:#fff;background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.12);}
      .section-title{margin:0 0 12px;font-size:16px;font-weight:800;letter-spacing:-0.03em;}
      .progress-wrap{margin-top:14px;}
      .progress-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
      .progress-track{width:100%;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden;}
      .progress-fill{height:100%;border-radius:inherit;background:var(--grad);}
      .progress-fill.success{background:linear-gradient(135deg,#00a86b,#2cd69d);}
      .progress-fill.warning{background:linear-gradient(135deg,#ff8c00,#ffb347);}
      .risk-list,.chip-list,.deduction-list,.question-list,.detail-list{display:flex;flex-direction:column;gap:10px;}
      .risk-item,.check-item,.bill-row,.deduction-item,.compare-line{display:flex;gap:12px;}
      .risk-item,.check-item,.deduction-item{border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,0.9);padding:14px;}
      .risk-item{border-left:4px solid var(--border);}
      .risk-item.danger{border-left-color:var(--danger);}
      .risk-item.warning{border-left-color:var(--warning);}
      .risk-item.success{border-left-color:var(--success);}
      .risk-title,.check-title,.compare-name,.settle-label,.bar-label{margin:0;font-size:15px;font-weight:800;letter-spacing:-0.02em;}
      .risk-desc,.risk-q,.check-desc,.compare-meta,.bar-meta,.settle-meta,.bill-note{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--mid);}
      .chip-list{flex-direction:row;flex-wrap:wrap;}
      .chip{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;border:1px solid transparent;padding:8px 12px;font-size:12px;font-weight:700;}
      .chip.included{background:rgba(0,168,107,0.12);border-color:rgba(0,168,107,0.18);color:var(--success);}
      .chip.excluded{background:rgba(230,0,0,0.08);border-color:rgba(230,0,0,0.14);color:var(--danger);}
      .chip.unknown{background:rgba(102,102,102,0.1);border-color:rgba(153,153,153,0.16);color:var(--mid);}
      .bar-card{display:flex;flex-direction:column;gap:12px;}
      .bar-row{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;}
      .bar-track{position:relative;height:12px;background:var(--surface2);border-radius:999px;overflow:hidden;}
      .bar-fill{height:100%;border-radius:inherit;background:var(--grad);}
      .bar-fill.soft{background:linear-gradient(135deg,rgba(230,0,0,0.68),rgba(255,68,68,0.48));}
      .bar-fill.gray{background:linear-gradient(135deg,#b8b8c2,#d5d5dc);}
      .wave-list{display:flex;flex-direction:column;gap:9px;}
      .wave-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;}
      .wave-label{font-size:12px;font-weight:700;color:var(--mid);}
      .wave-value{font-size:12px;font-weight:700;color:var(--dark);}
      .wave-fill{background:linear-gradient(135deg,rgba(230,0,0,0.8),rgba(255,68,68,0.7));}
      .compare-card{position:relative;}
      .compare-rank{position:absolute;top:14px;right:14px;}
      .compare-total{margin:10px 0 4px;font-size:28px;font-weight:800;letter-spacing:-0.04em;}
      .compare-line{justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px dashed rgba(224,224,224,0.9);}
      .compare-line:last-child{border-bottom:0;padding-bottom:0;}
      .compare-actions{margin-top:14px;}
      .nav-btn{appearance:none;border:0;background:transparent;color:var(--muted);padding:6px 4px 2px;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:16px;transition:background 0.18s ease,color 0.18s ease;}
      .nav-btn.active{color:var(--red);background:rgba(230,0,0,0.08);}
      .nav-icon{font-size:18px;line-height:1;}
      .nav-text{font-size:11px;font-weight:700;}
      .check-item{align-items:flex-start;}
      .check-item.high{border-left:4px solid var(--danger);}
      .check-toggle{margin-top:2px;width:20px;height:20px;accent-color:var(--red);}
      .question-pad{width:100%;min-height:170px;resize:vertical;border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:14px;color:var(--dark);line-height:1.5;}
      .question-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
      .settle-hero{padding:18px;background:radial-gradient(circle at top right,rgba(255,255,255,0.2),transparent 34%),linear-gradient(135deg,#00a86b,#34cb90);color:#fff;}
      .settle-amount{color:#fff;}
      .settle-sub{margin:8px 0 0;font-size:14px;color:rgba(255,255,255,0.88);}
      .deduction-item{justify-content:space-between;align-items:center;}
      .num-input{width:100%;border:1px solid var(--border);border-radius:16px;padding:12px 12px;background:#fff;color:var(--dark);}
      .input-card{display:flex;flex-direction:column;gap:8px;}
      .bill-table{width:100%;border-collapse:collapse;font-size:12px;}
      .bill-table th,.bill-table td{padding:10px 8px;text-align:right;border-bottom:1px solid rgba(224,224,224,0.85);white-space:nowrap;}
      .bill-table th:first-child,.bill-table td:first-child{text-align:left;}
      .bill-table thead th{color:var(--muted);font-weight:700;font-size:11px;}
      .bill-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:18px;background:#fff;}
      .helper-note,.foot-note{font-size:12px;color:var(--mid);line-height:1.5;}
      .helper-note strong,.foot-note strong{color:var(--dark);}
      .mono{font-variant-numeric:tabular-nums;}
    </style>
  </head>

            '<span class="mini-badge">겨울 최대 ' +
            fmtC(summary.winter.total) +
            "</span>" +
            "</div>" +
            '<div class="wave-list">' +
            wave
              .map(function (row) {
                return (
                  '<div class="wave-row">' +
                  '<span class="wave-label">' +
                  row.label +
                  "</span>" +
                  '<div class="bar-track"><div class="bar-fill wave-fill" style="width:' +
                  ((row.total / peak) * 100).toFixed(1) +
                  '%"></div></div>' +
                  '<span class="wave-value mono">' +
                  fmtC(row.total) +
                  (row.actual ? "*" : "") +
                  "</span>" +
                  "</div>"
                );
              })
              .join("") +
            "</div>" +
            '<p class="foot-note">* 1~4월은 제공된 실청구값, 이후는 계절별 예상치입니다.</p>' +
            "</div>" +
            '<div class="card">' +
            '<span class="card-kicker">보증금 기회비용</span>' +
            '<h2 class="section-title" style="margin-top:12px">보증금이 작지 않으면 월세처럼 봐야 합니다.</h2>' +
            '<p class="helper-note"><strong>' +
            fmt(room.deposit) +
            "</strong>을연<strong>" +
            (n(room.opportunityRate) * 100).toFixed(1) +
            "%</strong>로계산하면월<strong>" +
            fmt(getSeasonCost(room, "normal").depOpp) +
            "</strong>의기회비용이생깁니다.</p>" +
            "</div>" +
            "</section>"
          );
        }
        function renderCompare() {
          var ranked = S.rooms
            .map(function (room) {
              return {
                room: room,
                summary: getCostSummary(room),
                score: getTransparencyScore(room)
              };
            })
            .sort(function (a, b) {
              return a.summary.normal.total - b.summary.normal.total;
            });
          return (
            '<section class="screen">' +
            ranked
              .map(function (entry, index) {
                var status = getTransparencyStatus(entry.score);
                var rankText = index === 0 ? "1st" : index === 1 ? "2nd" : "3rd";
                return (
                  '<div class="compare-card">' +
                  '<span class="badge compare-rank">' +
                  rankText +
                  "</span>" +
                  '<span class="card-kicker">' +
                  escapeHtml(entry.room.housingType) +
                  "·" +
                  escapeHtml(entry.room.region) +
                  "</span>" +
                  '<p class="compare-name" style="margin-top:12px">' +
                  escapeHtml(entry.room.name) +
                  "</p>" +
                  '<div class="compare-total mono">' +
                  fmt(entry.summary.normal.total) +
                  "</div>" +
                  '<p class="compare-meta">광고 월세 ' +
                  fmt(entry.room.monthlyRent) +
                  "/관리비" +
                  fmt(entry.room.maintenanceFee) +
                  "/투명도" +
                  entry.score +
                  "점</p>" +
                  '<div style="margin-top:12px">' +
                  '<div class="compare-line"><span class="compare-meta">평상시 총액</span><strong class="mono">' +
                  fmtC(entry.summary.normal.total) +
                  "</strong></div>" +
                  '<div class="compare-line"><span class="compare-meta">겨울 최대치</span><strong class="mono">' +
                  fmtC(entry.summary.winter.total) +
                  "</strong></div>" +
                  '<div class="compare-line"><span class="compare-meta">투명도 상태</span><strong class="' +
                  getStatusClass(status.tone) +
                  '">' +
                  escapeHtml(status.label) +
                  "</strong></div>" +
                  "</div>" +
                  '<div class="compare-actions">' +
                  '<button class="primary-btn" onclick="pickRoom(\''+entry.room.id+'\')">이 방 보기</button>'+"</div>"+"</div>");
        }).join("")+"</section>");
        }function renderChecklist(room){var items=getChecklistForRoom(room);
        var checked=getCheckedMap(room.id);
        var doneCount=items.filter(function (item){return!!checked[item.id];
        }).length;
        var questions=getQuestionPadText(room);
        return ('<section class="screen">'+'<div class="card">'+'<div class="progress-head">'+'<div><span class="card-kicker">확인 진행률</span><h2 class="section-title" style="margin-top:12px">'+doneCount+"/8 완료</h2></div>"+'<span class="badge">'+Math.round((doneCount/8)*100)+"%</span>"+"</div>"+'<div class="progress-track"><div class="progress-fill" style="width:'+((doneCount/8)*100).toFixed(1)+'%"></div></div>'+"</div>"+items.map(function (item){return ('<label class="check-item '+(item.priority==="high"?"high":"")+'">'+'<input class="check-toggle" type="checkbox" '+(checked[item.id]?"checked ":"")+'onclick="toggleChecklist(\''+item.id+'\')">'+'<div style="flex:1">'+'<div class="progress-head" style="margin-bottom:0">'+'<p class="check-title">'+escapeHtml(item.title)+"</p>"+'<span class="mini-badge '+(item.priority==="high"?"tone-danger-bg":"")+'">'+(item.priority==="high"?"우선 확인":"기본 확인")+"</span>"+"</div>"+'<p class="check-desc">'+escapeHtml(item.desc)+"</p>"+"</div>"+"</label>");
        }).join("")+'<div class="card">'+'<div class="question-toolbar">'+'<div><h2 class="section-title" style="margin-bottom:4px">복사용 질문 모음</h2><p class="helper-note">중개인이나 임대인에게 바로 보내기 위한 문장입니다.</p></div>'+'<button class="copy-btn" onclick="copyQuestions()">복사</button>'+"</div>"+'<textarea id="questionPad" class="question-pad" readonly>'+escapeHtml(questions)+"</textarea>"+"</div>"+"</section>");
        }function renderMoveOut(room){var settlement=getMoveOutSettlement(room,getRoomSettlementOverrides(room.id));
        var bills=getBillsForRoom(room);
        var heroTone=settlement.finalReturn>=0?"":' style="background:linear-gradient(135deg,#ff8c00,#e60000)"';
        return ('<section class="screen">'+'<div class="settle-hero"'+heroTone+">"+'<span class="hero-tag">예상 보증금 반환액</span>'+'<div class="settle-amount mono">'+fmt(settlement.finalReturn)+"</div>"+'<p class="settle-sub">보증금 '+fmt(settlement.deposit)+" - 차감 합계 "+fmt(settlement.deductions)+"</p>"+"</div>"+'<div class="card">'+'<h2 class="section-title">차감 내역</h2>'+'<div class="deduction-list">'+settlement.items.map(function (item){return ('<div class="deduction-item">'+'<div><p class="settle-label">'+escapeHtml(item.label)+'</p><p class="settle-meta">현재 입력값 기준</p></div>'+'<strong class="mono">'+fmt(item.value)+"</strong>"+"</div>");
        }).join("")+"</div>"+"</div>"+'<div class="card">'+'<h2 class="section-title">정산값 조정</h2>'+'<div class="input-grid">'+'<div class="input-card"><label class="small-label" for="cleaningFee">청소비</label><input id="cleaningFee" class="num-input mono" type="number" min="0" step="1000" value="'+settlement.items[0].value+'" oninput="updateSettlementField(\'cleaningFee\', event.target.value)"></div>'+'<div class="input-card"><label class="small-label" for="repairFee">수리비</label><input id="repairFee" class="num-input mono" type="number" min="0" step="1000" value="'+settlement.items[1].value+'" oninput="updateSettlementField(\'repairFee\', event.target.value)"></div>'+'<div class="input-card"><label class="small-label" for="unpaidUtility">미납 공과금</label><input id="unpaidUtility" class="num-input mono" type="number" min="0" step="1000" value="'+settlement.items[2].value+'" oninput="updateSettlementField(\'unpaidUtility\', event.target.value)"></div>'+"</div>"+"</div>"+'<div class="card">'+'<div class="progress-head">'+'<h2 class="section-title" style="margin-bottom:0">월별 청구 이력</h2>'+'<span class="mini-badge">실청구/추정 혼합</span>'+"</div>"+'<div class="bill-wrap">'+'<table class="bill-table">'+"<thead><tr><th>월</th><th>월세</th><th>관리비</th><th>전기</th><th>가스</th><th>수도</th><th>기타</th><th>합계</th></tr></thead>"+"<tbody>"+bills.map(function (bill){return ("<tr>"+"<td>"+escapeHtml(bill.month)+"</td>"+'<td class="mono">'+fmtC(bill.rent)+"</td>"+'<td class="mono">'+fmtC(bill.maintenance)+"</td>"+'<td class="mono">'+fmtC(bill.electricity)+"</td>"+'<td class="mono">'+fmtC(bill.gas)+"</td>"+'<td class="mono">'+fmtC(bill.water)+"</td>"+'<td class="mono">'+fmtC(bill.other)+"</td>"+'<td class="mono"><strong>'+fmtC(bill.total)+"</strong></td>"+"</tr>");
        }).join("")+"</tbody></table></div>"+'<p class="bill-note">보증금 기회비용은 청구서 이력 표에는 넣지 않았습니다. 표는 실제/예상 청구 흐름 확인용입니다.</p>'+"</div>"+"</section>");
        }function renderBottomNav(){var items=[{id:"home",text:"홈",icon:"🏠"},{id:"breakdown",text:"해부도",icon:"📊"},{id:"compare",text:"비교",icon:"🏘"},{id:"checklist",text:"체크",icon:"✅"},{id:"moveout",text:"정산",icon:"💰"}];
        BOTTOMNAV.innerHTML=items.map(function (item){return ('<button class="nav-btn '+(S.tab===item.id?"active":"")+'" onclick="setTab(\''+item.id+'\')">'+'<span class="nav-icon">'+item.icon+"</span>"+'<span class="nav-text">'+item.text+"</span>"+"</button>");
        }).join("");
        }function renderScreen(room){if (S.tab==="breakdown"){return renderBreakdown(room);
        }if (S.tab==="compare"){return renderCompare();
        }if (S.tab==="checklist"){return renderChecklist(room);
        }if (S.tab==="moveout"){return renderMoveOut(room);
        }return renderHome(room);
        }function render(){var room=getRoom();
        renderTopbar();
        APP.innerHTML=renderScreen(room);
        renderBottomNav();
        }window.selectRoom=function (roomId){setState({roomId:roomId});
        };
        window.setTab=function (tab){setState({tab:tab});
        };
        window.pickRoom=function (roomId){setState({roomId:roomId,tab:"home"});
        };
        window.toggleChecklist=function (itemId){var checked=cloneValue(S.checked||{});
        if (!checked[S.roomId]){checked[S.roomId]={};
        }checked[S.roomId][itemId]=!checked[S.roomId][itemId];
        setState({checked:checked});
        };
        window.updateSettlementField=function (field,value){var settlement=cloneValue(S.settlement||{});
        if (!settlement[S.roomId]){settlement[S.roomId]={};
        }settlement[S.roomId][field]=n(value);
        setState({settlement:settlement});
        };
        window.copyQuestions=function (){var textarea=document.getElementById("questionPad");
        if (!textarea){return;
        }textarea.focus();
        textarea.select();
        var copied=false;
        try{if (navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(textarea.value);
        copied=true;
        }}catch (err){}if (!copied){try{copied=document.execCommand("copy");
        }catch (err){copied=false;
        }}window.alert(copied?"질문 목록을 복사했습니다.":"텍스트를 선택했습니다. 복사 단축키를 눌러주세요.");
        };
        window.resetData=resetData;
        window.updateRoom=updateRoom;
        window.updateRoomDeep=updateRoomDeep;
        window.loadState=loadState;
        window.saveState=saveState;
        window.getRoom=getRoom;
        window.n=n;
        window.fmt=fmt;
        window.fmtC=fmtC;
        window.depositOpp=depositOpp;
        window.cloneRoom=cloneRoom;
        window.getSeasonCost=getSeasonCost;
        window.getCostSummary=getCostSummary;
        window.getMonthlyWave=getMonthlyWave;
        window.getTransparencyScore=getTransparencyScore;
        window.getTransparencyStatus=getTransparencyStatus;
        window.getRiskSignals=getRiskSignals;
        window.getChecklistForRoom=getChecklistForRoom;
        window.getMoveOutSettlement=getMoveOutSettlement;
        var S=DEMO?createDemoState():loadState();
        window.S=S;
        render();
        })();
    </script>
  </body>
</html>
