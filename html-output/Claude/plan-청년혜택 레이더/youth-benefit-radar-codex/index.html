<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>청년혜택 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Cohere Design Tokens ── */
:root {
  --bg:       #060A14;
  --shell:    #080D18;
  --surface:  #0C1628;
  --surface2: #111D33;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);

  --text:    #EDF1FF;
  --text2:   #8B9CB6;
  --muted:   #4E5D73;

  --coral:   #FF6B35;
  --purple:  #9B5DE5;
  --teal:    #06C8DC;
  --green:   #05E39C;
  --amber:   #FFB800;
  --red:     #FF4D6A;

  --coral-bg:  rgba(255,107,53,0.12);
  --purple-bg: rgba(155,93,229,0.12);
  --teal-bg:   rgba(6,200,220,0.12);
  --green-bg:  rgba(5,227,156,0.12);
  --amber-bg:  rgba(255,184,0,0.12);
  --red-bg:    rgba(255,77,106,0.12);

  --grad:      linear-gradient(135deg,#FF6B35,#9B5DE5);
  --grad-cool: linear-gradient(135deg,#9B5DE5,#06C8DC);
  --grad-bar:  linear-gradient(90deg,#FF6B35,#9B5DE5,#06C8DC);

  --nav-h: 62px;
  --top-h: 58px;
  --safe:  env(safe-area-inset-bottom, 0px);
  --font:  'Inter', -apple-system, sans-serif;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; background:var(--bg); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; }

/* ── Phone Shell ── */
#phone {
  display:flex; flex-direction:column;
  height:100vh; width:100%; max-width:430px;
  margin:0 auto; overflow:hidden;
  background:var(--shell);
  position:relative;
}
@media(min-width:500px){
  body { display:flex; align-items:center; justify-content:center; min-height:100vh;
    background: radial-gradient(ellipse 60% 50% at 20% 10%,rgba(155,93,229,.18),transparent 55%),
                radial-gradient(ellipse 50% 45% at 80% 90%,rgba(255,107,53,.14),transparent 55%),
                var(--bg); }
  #phone { height:min(900px,96vh); border-radius:36px; overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 40px 80px rgba(0,0,0,.8); }
}

/* ── Topbar ── */
#topbar {
  height:var(--top-h); flex-shrink:0;
  display:flex; align-items:center; gap:12px; padding:0 18px;
  background:rgba(8,13,24,.88); backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:relative; z-index:10;
}
.logo {
  width:34px; height:34px; border-radius:10px; flex-shrink:0;
  background:var(--grad); display:grid; place-items:center;
  font-size:13px; font-weight:900; color:#fff; letter-spacing:-.5px;
  box-shadow:0 0 16px rgba(255,107,53,.4);
}
.brand { flex:1; }
.brand-name { font-size:15px; font-weight:800; color:var(--text); letter-spacing:-.3px; }
.brand-sub  { font-size:11px; color:var(--muted); margin-top:1px; }
.top-btn {
  width:34px; height:34px; border-radius:10px; border:1px solid var(--border2);
  background:var(--surface); display:grid; place-items:center;
  color:var(--text2); font-size:16px; cursor:pointer; transition:background .15s;
}
.top-btn:hover { background:var(--surface2); }

/* ── Screen ── */
#screen {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding-bottom:calc(var(--nav-h) + var(--safe) + 8px);
  background:var(--shell);
  scroll-behavior:smooth;
}
#screen::-webkit-scrollbar { display:none; }

/* ── Bottom Nav ── */
#nav {
  height:calc(var(--nav-h) + var(--safe));
  padding-bottom:var(--safe);
  flex-shrink:0;
  display:flex; align-items:flex-start; padding-top:6px;
  background:rgba(8,13,24,.94); backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:6px 0; border:none; background:none; cursor:pointer;
  color:var(--muted); font-size:10px; font-weight:600; font-family:var(--font);
  transition:color .15s; position:relative;
}
.nav-item.active { color:var(--coral); }
.nav-item.active::before {
  content:''; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  width:24px; height:2px; border-radius:2px; background:var(--coral);
}
.nav-icon { font-size:20px; line-height:1; }

/* ── Typography ── */
.eyebrow {
  font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.section-label { font-size:14px; font-weight:800; color:var(--text); }

/* ── Padding Wrappers ── */
.px { padding:0 16px; }
.py { padding:14px 0; }
.gap { height:12px; }
.gap-lg { height:20px; }

/* ── Hero Card ── */
.hero-card {
  margin:14px 16px 0;
  background:linear-gradient(135deg,rgba(255,107,53,.1),rgba(155,93,229,.08));
  border:1px solid rgba(255,107,53,.22); border-radius:20px; padding:20px;
  position:relative; overflow:hidden;
}
.hero-card::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(ellipse 80% 80% at 110% 110%,rgba(155,93,229,.15),transparent);
  pointer-events:none;
}
.hero-row { display:flex; gap:12px; margin-top:12px; }
.hero-stat {
  flex:1; background:rgba(255,255,255,.05); border:1px solid var(--border2);
  border-radius:14px; padding:14px 12px;
}
.hero-stat-num { font-size:26px; font-weight:900; line-height:1; }
.hero-stat-num.coral { color:var(--coral); }
.hero-stat-num.purple { color:var(--purple); }
.hero-stat-label { font-size:11px; color:var(--text2); margin-top:4px; }
.hero-action { margin-top:14px; text-align:right; }

/* ── Action Strip ── */
.action-strip {
  margin:12px 16px 0;
  background:var(--surface); border:1px solid var(--border2); border-radius:16px;
  padding:14px 16px; display:flex; align-items:center; gap:12px;
  border-left:3px solid var(--coral);
}
.action-strip-body { flex:1; min-width:0; }
.action-strip-tag { font-size:10px; font-weight:700; color:var(--coral); text-transform:uppercase; letter-spacing:.08em; }
.action-strip-title { font-size:14px; font-weight:700; color:var(--text); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.action-strip-meta { font-size:11px; color:var(--text2); margin-top:2px; }

/* ── Section Header ── */
.sec-header { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px; }

/* ── Radar Bars ── */
.radar-card { margin:0 16px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; }
.radar-row { display:grid; grid-template-columns:52px 1fr 32px; align-items:center; gap:10px; margin-bottom:10px; }
.radar-row:last-child { margin-bottom:0; }
.radar-label { font-size:12px; font-weight:600; color:var(--text2); }
.radar-bar  { height:6px; border-radius:99px; background:rgba(255,255,255,.07); overflow:hidden; }
.radar-bar i { display:block; height:100%; border-radius:inherit; background:var(--grad-bar); }
.radar-score { font-size:12px; font-weight:800; color:var(--text); text-align:right; }

/* ── Benefit Cards ── */
.benefit-card {
  margin:0 16px 10px;
  background:var(--surface); border:1px solid var(--border); border-radius:18px;
  padding:16px; transition:border-color .2s, transform .2s;
}
.benefit-card:hover { border-color:rgba(255,107,53,.3); transform:translateY(-1px); }
.benefit-card:last-child { margin-bottom:0; }
.bc-top { display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.bc-body { margin-bottom:12px; }
.bc-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:4px; line-height:1.3; }
.bc-summary { font-size:12px; color:var(--text2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.bc-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.bc-reason { font-size:11px; color:var(--text2); background:rgba(255,255,255,.04); border-radius:8px; padding:8px 10px; border-left:2px solid var(--coral); margin-bottom:12px; line-height:1.5; }

/* ── Pills ── */
.pill {
  display:inline-flex; align-items:center; border-radius:99px;
  padding:4px 10px; font-size:11px; font-weight:700;
}
.pill-teal   { background:var(--teal-bg);   color:#3DD8EA; border:1px solid rgba(6,200,220,.22); }
.pill-purple { background:var(--purple-bg);  color:#B57BF0; border:1px solid rgba(155,93,229,.22); }
.pill-coral  { background:var(--coral-bg);   color:var(--coral); border:1px solid rgba(255,107,53,.22); }
.pill-amber  { background:var(--amber-bg);   color:var(--amber); border:1px solid rgba(255,184,0,.22); }
.pill-red    { background:var(--red-bg);     color:var(--red);   border:1px solid rgba(255,77,106,.22); }
.pill-gray   { background:rgba(255,255,255,.06); color:var(--text2); border:1px solid var(--border2); }
.pill-green  { background:var(--green-bg);   color:var(--green); border:1px solid rgba(5,227,156,.22); }

/* ── Score Circle ── */
.score-circle {
  width:48px; height:48px; border-radius:14px; flex-shrink:0;
  background:var(--grad); display:grid; place-items:center;
  font-size:18px; font-weight:900; color:#fff;
  box-shadow:0 0 16px rgba(255,107,53,.35);
}

/* ── Buttons ── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:12px; padding:10px 16px;
  font-family:var(--font); font-size:14px; font-weight:700; cursor:pointer; transition:all .15s;
}
.btn-primary { background:var(--grad); color:#fff; box-shadow:0 4px 16px rgba(255,107,53,.3); }
.btn-primary:hover { box-shadow:0 6px 22px rgba(255,107,53,.48); transform:translateY(-1px); }
.btn-ghost { background:rgba(255,255,255,.07); color:var(--text2); border:1px solid var(--border2); }
.btn-ghost:hover { background:rgba(255,255,255,.12); color:var(--text); }
.btn-sm { font-size:12px; padding:7px 12px; border-radius:10px; }
.btn-full { width:100%; }
.btn-danger { background:var(--red-bg); color:var(--red); border:1px solid rgba(255,77,106,.2); }
.btn-link { background:none; color:var(--coral); font-size:12px; padding:0; }

/* ── Filter Chips ── */
.filter-row { display:flex; gap:8px; padding:0 16px 12px; overflow-x:auto; }
.filter-row::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:99px; font-size:12px; font-weight:700;
  border:1px solid var(--border2); background:rgba(255,255,255,.04); color:var(--text2);
  cursor:pointer; white-space:nowrap; transition:all .15s; font-family:var(--font);
}
.chip:hover { border-color:var(--coral); color:var(--text); }
.chip.active { background:var(--coral); border-color:var(--coral); color:#fff; box-shadow:0 4px 12px rgba(255,107,53,.3); }

/* ── Match Screen Header ── */
.screen-hero {
  padding:18px 16px 0;
  background:linear-gradient(180deg,rgba(155,93,229,.08) 0%,transparent 100%);
}
.screen-hero h1 { font-size:22px; font-weight:900; color:var(--text); margin-top:6px; letter-spacing:-.5px; }
.screen-hero p  { font-size:13px; color:var(--text2); margin-top:4px; line-height:1.5; }

/* ── Calendar ── */
.timeline-item {
  margin:0 16px 10px;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  display:flex; align-items:center; gap:14px; padding:14px;
  cursor:pointer; width:calc(100% - 32px); text-align:left; font-family:var(--font);
  transition:border-color .15s, background .15s;
}
.timeline-item:hover { border-color:rgba(255,107,53,.3); background:rgba(255,107,53,.04); }
.tl-day { min-width:52px; text-align:center; }
.tl-day-num { font-size:22px; font-weight:900; line-height:1; }
.tl-day-date { font-size:10px; color:var(--text2); margin-top:2px; }
.tl-body { flex:1; min-width:0; }
.tl-title { font-size:14px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tl-meta { font-size:11px; color:var(--text2); margin-top:3px; }
.tl-score { font-size:14px; font-weight:800; color:var(--purple); flex-shrink:0; }
.urgency-urgent .tl-day-num { color:var(--red); }
.urgency-soon   .tl-day-num { color:var(--amber); }
.urgency-safe   .tl-day-num { color:var(--teal); }
.urgency-closed .tl-day-num { color:var(--muted); }
.urgency-always .tl-day-num { color:var(--green); }
.urgency-urgent { border-color:rgba(255,77,106,.25); }
.urgency-soon   { border-color:rgba(255,184,0,.22); }

/* ── Documents ── */
.doc-policy {
  margin:0 16px 12px; background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden;
}
.doc-policy-head { padding:14px 16px 10px; }
.doc-policy-title { font-size:14px; font-weight:700; color:var(--text); }
.doc-policy-meta  { font-size:11px; color:var(--text2); margin-top:2px; }
.doc-prog-bar { height:4px; background:rgba(255,255,255,.07); }
.doc-prog-bar i { display:block; height:100%; background:var(--grad-bar); transition:width .4s; }
.check-item {
  display:flex; align-items:flex-start; gap:12px; padding:12px 16px;
  border-top:1px solid var(--border); cursor:pointer; transition:background .15s;
}
.check-item:hover { background:rgba(255,255,255,.03); }
.check-item.checked { background:var(--green-bg); }
.check-item input { width:18px; height:18px; accent-color:var(--coral); flex-shrink:0; margin-top:2px; cursor:pointer; }
.check-item-body { flex:1; }
.check-item-name  { font-size:13px; font-weight:600; color:var(--text); }
.check-item.checked .check-item-name { text-decoration:line-through; color:var(--text2); }
.check-item-issuer{ font-size:11px; color:var(--text2); margin-top:2px; }
.check-badge { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; flex-shrink:0; margin-top:2px; }
.check-badge.req { background:var(--coral-bg); color:var(--coral); }
.check-badge.opt { background:rgba(255,255,255,.06); color:var(--muted); }

/* ── Profile Form ── */
.form-section { margin:0 16px 12px; background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden; }
.form-section-title { padding:14px 16px 0; font-size:12px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:.08em; }
.form-field { padding:10px 16px; }
.form-label { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:6px; display:block; }
.form-input {
  width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border2);
  border-radius:10px; padding:10px 12px; color:var(--text); font-family:var(--font); font-size:14px;
  outline:none; transition:border-color .15s, box-shadow .15s;
}
.form-input:focus { border-color:var(--coral); box-shadow:0 0 0 3px rgba(255,107,53,.15); }
select.form-input option { background:#0C1628; color:var(--text); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.form-row .form-field { border-right:1px solid var(--border); }
.form-row .form-field:last-child { border-right:none; }
.interest-grid { padding:10px 16px 14px; display:flex; flex-wrap:wrap; gap:8px; }
.interest-chip {
  padding:7px 12px; border-radius:99px; font-size:12px; font-weight:700;
  border:1px solid var(--border2); background:rgba(255,255,255,.04); color:var(--text2);
  cursor:pointer; transition:all .15s; font-family:var(--font);
}
.interest-chip.on { border-color:var(--coral); background:var(--coral-bg); color:var(--coral); }
.privacy-note { margin:0 16px 12px; padding:12px 14px; border:1px dashed var(--border2); border-radius:12px; }
.privacy-note p { font-size:11px; color:var(--muted); line-height:1.6; }

/* ── Detail Screen ── */
.detail-hero {
  padding:16px 16px 0;
  background:linear-gradient(180deg,rgba(255,107,53,.07) 0%,transparent 100%);
}
.detail-hero h1 { font-size:20px; font-weight:800; color:var(--text); margin:8px 0; letter-spacing:-.3px; line-height:1.3; }
.detail-score-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
.detail-score-big { font-size:36px; font-weight:900; color:var(--coral); line-height:1; }
.detail-score-label { font-size:11px; color:var(--text2); }
.detail-card { margin:12px 16px 0; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
.detail-card-head { padding:14px 16px 10px; border-bottom:1px solid var(--border); }
.detail-card-head h3 { font-size:13px; font-weight:700; color:var(--text); }
.eval-item { padding:10px 16px; border-bottom:1px solid var(--border); }
.eval-item:last-child { border-bottom:none; }
.eval-matched    { border-left:3px solid var(--green); }
.eval-needs_check{ border-left:3px solid var(--amber); }
.eval-failed     { border-left:3px solid var(--muted); }
.eval-title { font-size:13px; font-weight:600; color:var(--text); }
.eval-msg   { font-size:12px; color:var(--text2); margin-top:3px; line-height:1.5; }
.info-row { display:flex; justify-content:space-between; align-items:center; padding:10px 16px; border-bottom:1px solid var(--border); }
.info-row:last-child { border-bottom:none; }
.info-label { font-size:12px; color:var(--text2); }
.info-value { font-size:13px; font-weight:600; color:var(--text); text-align:right; }
.doc-mini { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px 16px; }
.doc-mini-item { background:rgba(255,255,255,.04); border:1px solid var(--border); border-radius:10px; padding:10px; }
.doc-mini-name   { font-size:12px; font-weight:700; color:var(--text); }
.doc-mini-issuer { font-size:11px; color:var(--text2); margin-top:3px; }
.trust-card { margin:12px 16px 0; background:rgba(6,200,220,.05); border:1px solid rgba(6,200,220,.2); border-radius:16px; padding:16px; }
.trust-card h3 { font-size:14px; font-weight:700; color:var(--text); margin-bottom:8px; }
.trust-card p  { font-size:12px; color:var(--text2); line-height:1.6; }

/* ── Empty State ── */
.empty { text-align:center; padding:60px 24px; }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty p { font-size:14px; color:var(--text2); }

/* ── Divider ── */
.divider { height:1px; background:var(--border); margin:0 16px; }

/* ── Progress Badge ── */
.prog-badge { font-size:11px; font-weight:700; }
.prog-badge.done   { color:var(--green); }
.prog-badge.partial{ color:var(--amber); }
.prog-badge.none   { color:var(--text2); }
</style>
</head>
<body>
<div id="phone">
  <!-- Topbar -->
  <div id="topbar">
    <div class="logo">YR</div>
    <div class="brand">
      <div class="brand-name">청년혜택 레이더</div>
      <div class="brand-sub">내 조건 기준 청년정책 매칭</div>
    </div>
    <button class="top-btn" id="settings-btn" title="설정">⚙</button>
  </div>

  <!-- Screen -->
  <div id="screen"></div>

  <!-- Bottom Nav -->
  <nav id="nav">
    <button class="nav-item active" data-tab="home">
      <span class="nav-icon">🏠</span>홈
    </button>
    <button class="nav-item" data-tab="matches">
      <span class="nav-icon">🎯</span>매칭
    </button>
    <button class="nav-item" data-tab="calendar">
      <span class="nav-icon">📅</span>마감
    </button>
    <button class="nav-item" data-tab="docs">
      <span class="nav-icon">📋</span>서류
    </button>
    <button class="nav-item" data-tab="profile">
      <span class="nav-icon">👤</span>내 조건
    </button>
  </nav>
</div>

<script>
/* ── deadlines ── */
const TODAY = new Date('2026-04-24T09:00:00+09:00');
function getDaysLeft(d,t=TODAY){if(!d)return null;return Math.ceil((new Date(d+'T23:59:59+09:00')-t)/(864e5));}
function deadlineLabel(p){if(p.deadline.status==='always'||!p.deadline.endDate)return'상시';const d=getDaysLeft(p.deadline.endDate);if(d===null)return'상시';if(d<0)return'마감';if(d===0)return'오늘';return'D-'+d;}
function deadlineUrgency(p){if(p.deadline.status==='always'||!p.deadline.endDate)return'always';const d=getDaysLeft(p.deadline.endDate);if(d===null)return'always';if(d<0)return'closed';if(d<=3)return'urgent';if(d<=7)return'soon';return'safe';}

/* ── doc progress ── */
function docProg(policy,prog){
  const req=policy.requiredDocuments.filter(d=>d.required);
  const checked=new Set(prog?.checkedDocumentIds??[]);
  const done=req.filter(d=>checked.has(d.id)).length;
  return{total:req.length,done,pct:req.length?Math.round(done/req.length*100):100};
}

/* ── matching ── */
function evalRule(r,profile,policy){
  const base={id:r.id,text:r.plainText,required:r.required};
  if(r.operator==='requires_check'){const s=r.checkWeight==='high'?50:r.checkWeight==='medium'?65:75;return{...base,status:'needs_check',score:s,msg:r.plainText+'. 공식 기준 확인이 필요해요.'};}
  if(r.operator==='region_match'){const ok=policy.regionScope==='전국'||(policy.regionSido&&policy.regionSido===profile.regionSido);return{...base,status:ok?'matched':'failed',score:ok?100:0,msg:ok?'지역 조건에 맞아요.':'지역 조건이 맞지 않을 수 있어요.'};}
  if(r.operator==='interest_match'){const ok=(r.value||[]).some(v=>profile.interests.includes(v));return{...base,status:ok?'matched':'needs_check',score:ok?100:55,msg:ok?'관심 분야와 일치해요.':'관심 분야와 직접 일치하지 않지만 확인해볼 수 있어요.'};}
  const pv=profile[r.field];
  if(r.operator==='between'){const[mn,mx]=r.value.map(Number);const n=Number(pv);const ok=n>=mn&&n<=mx;return{...base,status:ok?'matched':'failed',score:ok?100:0,msg:ok?`만 ${n}세는 대상 범위예요.`:`만 ${n}세는 대상 범위와 맞지 않아요.`};}
  if(r.operator==='equals'){const ok=String(pv)===String(r.value);return{...base,status:ok?'matched':'failed',score:ok?100:0,msg:ok?'조건과 일치해요.':'조건과 일치하지 않아요.'};}
  if(r.operator==='one_of'){const ok=(r.value||[]).includes(String(pv));return{...base,status:ok?'matched':'failed',score:ok?100:0,msg:ok?'허용 범위에 포함돼요.':'주요 대상과 다를 수 있어요.'};}
  return{...base,status:'needs_check',score:50,msg:'조건 해석이 필요해요.'};
}
function matchP(policy,profile){
  const ev=policy.eligibilityRules.map(r=>evalRule(r,profile,policy));
  const req=ev.filter(e=>e.required),opt=ev.filter(e=>!e.required);
  const rs=req.length?req.reduce((s,e)=>s+e.score,0)/req.length:100;
  const os=opt.length?opt.reduce((s,e)=>s+e.score,0)/opt.length:80;
  const dl=getDaysLeft(policy.deadline.endDate);
  const ds=dl===null?82:dl<0?0:dl<=3?70:dl<=14?92:82;
  const score=Math.max(0,Math.min(100,Math.round(rs*.68+os*.18+ds*.14)));
  const hasFail=ev.some(e=>e.required&&e.status==='failed');
  const hasCheck=ev.some(e=>e.status==='needs_check');
  const isClosed=policy.deadline.status==='closed'||(dl!==null&&dl<0);
  const status=isClosed?'closed':hasFail?'not_eligible':hasCheck?'needs_check':'likely_eligible';
  return{policy,score:status==='closed'?Math.min(score,30):score,status,
    matchedReasons:ev.filter(e=>e.status==='matched').map(e=>e.msg),
    checkReasons:ev.filter(e=>e.status==='needs_check').map(e=>e.msg),
    evals:ev};
}
function matchAll(policies,profile){
  const w={likely_eligible:4,needs_check:3,not_eligible:2,closed:1};
  return policies.map(p=>matchP(p,profile)).sort((a,b)=>w[a.status]!==w[b.status]?w[b.status]-w[a.status]:b.score-a.score);
}

/* ── Screens ── */

    const sc=rs.filter(r=>r.policy.category===c);
    return{cat:c,score:sc.length?Math.round(sc.reduce((s,r)=>s+r.score,0)/sc.length):0};

  </div>

/* ── Main render ── */
function render(){
  const scr=document.getElementById('screen');
  if(state.tab==='detail'){
    const rs=results();
    const r=rs.find(r=>r.policy.id===state.detailId)||rs[0];
    if(r){scr.innerHTML=renderDetail(r);}
  } else if(state.tab==='home')    scr.innerHTML=renderHome();
  else if(state.tab==='matches')   scr.innerHTML=renderMatches();
  else if(state.tab==='calendar')  scr.innerHTML=renderCalendar();
  else if(state.tab==='docs')      scr.innerHTML=renderDocs();
  else if(state.tab==='profile')   scr.innerHTML=renderProfile();
  else if(state.tab==='settings')  scr.innerHTML=renderSettings();
  scr.scrollTop=0;
  bindEvents();
}

/* ── Events ── */
function bindEvents(){
  // detail buttons
  document.querySelectorAll('[data-detail]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();openDetail(el.dataset.detail);});
  });
  // tab buttons
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click',()=>setTab(el.dataset.tab));
  });
  // back
  const bb=document.getElementById('back-btn');
  if(bb) bb.addEventListener('click',goBack);
  // filter chips
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click',()=>{state.statusFilter=b.dataset.filter;render();});
  });
  // profile inputs
  document.querySelectorAll('[data-profile]').forEach(input=>{
    input.addEventListener('change',()=>{
      const k=input.dataset.profile;
      state.profile[k]=k==='age'?Number(input.value):input.value;
      wSt(PK,state.profile); render();
    });
  });
  // interest chips
  document.querySelectorAll('[data-interest]').forEach(b=>{
    b.addEventListener('click',()=>{
      const c=b.dataset.interest;
      state.profile.interests=state.profile.interests.includes(c)?state.profile.interests.filter(i=>i!==c):[...state.profile.interests,c];
      wSt(PK,state.profile); render();
    });
  });
  // doc checkboxes
  document.querySelectorAll('[data-doc-policy]').forEach(input=>{
    input.addEventListener('change',()=>{
      const pid=input.dataset.docPolicy,did=input.dataset.docId;
      let ex=state.docProgress.find(i=>i.policyId===pid);
      if(!ex){ex={policyId:pid,checkedDocumentIds:[]};state.docProgress.push(ex);}
      if(ex.checkedDocumentIds.includes(did)) ex.checkedDocumentIds=ex.checkedDocumentIds.filter(i=>i!==did);
      else ex.checkedDocumentIds.push(did);
      wSt(DK,state.docProgress); render();
    });
  });
  // reset
  document.querySelectorAll('[data-reset]').forEach(b=>{
    b.addEventListener('click',()=>{
      rmSt(PK);rmSt(DK);
      state.profile=JSON.parse(JSON.stringify(DEFAULT));
      state.docProgress=[];state.tab='home';state.detailId=null;
      document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.tab==='home'));
      render();
    });
  });
  // action strip click (whole strip)
  document.querySelectorAll('.action-strip[data-detail]').forEach(el=>{
    el.addEventListener('click',()=>openDetail(el.dataset.detail));
  });
}

// Nav tab clicks
document.querySelectorAll('.nav-item').forEach(b=>{
  b.addEventListener('click',()=>setTab(b.dataset.tab));
});
// Settings button
document.getElementById('settings-btn').addEventListener('click',()=>{
  state.tab='settings';document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));render();
});

render();
</script>
