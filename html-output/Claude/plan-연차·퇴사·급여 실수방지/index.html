<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>연차·퇴사·급여 실수방지</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0C0C1A;--shell:#111127;--surface:#16163A;--surface2:#1E1E4A;
  --purple:#8B5CF6;--blue:#3B82F6;--cyan:#06B6D4;--green:#10B981;
  --amber:#F59E0B;--red:#EF4444;--text:#F0F0FF;--mid:#9090B0;--muted:#6060A0;
  --border:rgba(139,92,246,.18);--grad:linear-gradient(135deg,#8B5CF6,#3B82F6);
}
body{background:var(--bg);font-family:'Inter',sans-serif;min-height:100vh;color:var(--text);}
#phone{display:flex;flex-direction:column;height:100vh;width:100%;max-width:430px;margin:0 auto;background:var(--shell);overflow:hidden;}
@media(min-width:500px){
  body{display:flex;align-items:center;justify-content:center;padding:20px;}
  #phone{height:min(900px,96vh);border-radius:32px;box-shadow:0 0 0 1px rgba(139,92,246,.25),0 40px 80px rgba(0,0,0,.8);}
}
/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--shell);}
.topbar-title{font-size:15px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.topbar-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.topbar-btn{background:rgba(139,92,246,.15);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--mid);}
/* Content */
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}
/* Bottom nav */
.bottomnav{display:flex;border-top:1px solid var(--border);background:var(--shell);flex-shrink:0;}
.nav-btn{flex:1;padding:10px 4px 8px;background:none;border:none;font-size:10px;font-family:'Inter',sans-serif;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);transition:color .15s;border-top:2px solid transparent;}
.nav-btn.active{color:var(--purple);border-top-color:var(--purple);}
.nav-btn .icon{font-size:20px;line-height:1;}
/* Cards */
.card{background:var(--surface);border-radius:16px;padding:16px;border:1px solid var(--border);margin-bottom:12px;}
.card-sm{padding:12px;}
/* Hero card */
.hero-card{background:var(--grad);border-radius:16px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden;}
.hero-card::before{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero-card .eyebrow{font-size:11px;color:rgba(255,255,255,.7);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.hero-card .big-num{font-size:32px;font-weight:900;color:#FFF;letter-spacing:-1px;}
.hero-card .sub{font-size:13px;color:rgba(255,255,255,.8);margin-top:6px;}
/* Warning card */
.warn-card{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-left:3px solid var(--amber);border-radius:0 12px 12px 0;padding:12px;margin-bottom:8px;}
.warn-card .wt{font-size:13px;font-weight:600;color:var(--amber);}
.warn-card p{font-size:12px;color:var(--mid);margin-top:3px;}
.danger-card{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-left:3px solid var(--red);border-radius:0 12px 12px 0;padding:12px;margin-bottom:8px;}
.danger-card .wt{font-size:13px;font-weight:600;color:var(--red);}
.danger-card p{font-size:12px;color:var(--mid);margin-top:3px;}
/* Typography */
.eyebrow{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.sect-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.sect-title h2{font-size:15px;font-weight:700;color:var(--text);}
.grad-num{font-size:28px;font-weight:900;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;margin:4px 0;}
/* Pill */
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.pill-purple{background:rgba(139,92,246,.15);color:var(--purple);}
.pill-green{background:rgba(16,185,129,.15);color:var(--green);}
.pill-amber{background:rgba(245,158,11,.15);color:var(--amber);}
.pill-red{background:rgba(239,68,68,.15);color:var(--red);}
.pill-blue{background:rgba(59,130,246,.15);color:var(--blue);}
/* Progress */
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:8px 0;}
.prog-fill{height:100%;border-radius:3px;}
.prog-fill.purple{background:var(--grad);}
.prog-fill.green{background:var(--green);}
.prog-fill.amber{background:var(--amber);}
.prog-fill.red{background:var(--red);}
/* Stats row */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat-cell{background:var(--surface2);border-radius:12px;padding:12px 10px;text-align:center;}
.stat-cell .num{font-size:20px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stat-cell .label{font-size:10px;color:var(--muted);margin-top:2px;}
/* Input */
.field{margin-bottom:12px;}
.field label{font-size:12px;color:var(--mid);display:block;margin-bottom:4px;font-weight:500;}
.field input,.field select{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);outline:none;}
.field input:focus,.field select:focus{border-color:var(--purple);}
/* Insurance rows */
.ins-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--surface2);}
.ins-row:last-child{border-bottom:none;}
.ins-row span{font-size:12px;color:var(--mid);}
.ins-row strong{font-size:13px;font-weight:600;color:var(--text);}
.ins-total{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;margin-top:10px;}
.ins-total span{font-size:13px;font-weight:600;color:var(--mid);}
.ins-total strong{font-size:15px;font-weight:800;color:var(--text);}
/* Checklist */
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--surface2);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.cl-item.checked{opacity:.6;}
.cl-item input{width:18px;height:18px;accent-color:var(--purple);flex-shrink:0;margin-top:1px;cursor:pointer;}
.cl-item strong{font-size:13px;font-weight:600;color:var(--text);}
.cl-item p{font-size:11px;color:var(--mid);margin-top:2px;line-height:1.4;}
/* Timeline */
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:16px;}
.tl-dot{position:absolute;left:-17px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--purple);border:2px solid var(--shell);}
.tl-dot.active{background:var(--grad);box-shadow:0 0 8px rgba(139,92,246,.5);}
.tl-item strong{font-size:13px;font-weight:600;color:var(--text);}
.tl-item p{font-size:11px;color:var(--mid);margin-top:2px;}
/* Table */
.calc-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.calc-table td{padding:8px 0;border-bottom:1px solid var(--surface2);}
.calc-table td:last-child{text-align:right;font-weight:600;color:var(--text);}
.calc-table .total-row td{padding-top:12px;font-size:15px;font-weight:800;border-bottom:none;}
.calc-table .total-row td:last-child{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
/* Button */
.btn-grad{width:100%;padding:12px;background:var(--grad);color:#FFF;border:none;border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;font-weight:700;cursor:pointer;margin-top:10px;}
.btn-outline{width:100%;padding:11px;background:transparent;border:1px solid var(--purple);color:var(--purple);border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;margin-top:8px;}
/* Notice */
.notice{font-size:11px;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.5;}
/* Divider */
.divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
</style>
</head>
<body>
<div id="phone">
  <div class="topbar">
    <div>
      <div class="topbar-title">연차·퇴사·급여 실수방지</div>
      <div class="topbar-sub">내 근로 권리를 지키는 계산기</div>
    </div>
    <button class="topbar-btn" onclick="setState({tab:'profile'})" title="내 정보">⚙</button>
  </div>
  <div class="content" id="content"></div>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────
const TODAY='2026-04-25';
const SK='leave-resign-v2';
const SALARY_CL=[
  {id:'meal',title:'식대 비과세 20만원 적용 확인',desc:'월 20만원까지 비과세 처리. 급여명세서에 식대 항목이 따로 표기되어야 합니다.'},
  {id:'overtime',title:'야근·주말수당 포함 여부 확인',desc:'연장·야간·휴일 근로수당이 급여명세서에 명시되어야 합니다.'},
  {id:'leave-pay',title:'연차수당 지급 여부 확인',desc:'미사용 연차는 퇴직 시 또는 연도 말 수당으로 받을 수 있습니다.'},
  {id:'insurance-match',title:'4대보험 고지서와 공제액 일치 확인',desc:'실제 공제된 금액이 건보공단·국민연금 고지서와 다르면 사업주에게 확인하세요.'},
  {id:'before-after',title:'세전·세후 금액 본인 계산과 일치',desc:'세전 월급에서 4대보험·소득세 공제 후 실수령액과 급여명세서가 맞는지 확인하세요.'},
  {id:'payslip',title:'매월 급여명세서 수령 여부',desc:'급여명세서 미제공은 근로기준법 위반입니다. 문자·이메일로라도 받아두세요.'}
];

// ── STATE ─────────────────────────────────────────────────────
const DEMO=new URLSearchParams(location.search).has('demo');
const DEFAULT={
  tab:'home',
  profile:{joinDate:'2023-04-01',monthlySalary:3000000,salaryDay:25,usedLeaveDays:5,dependents:0,hasFourInsurance:true,plannedLeaveDate:'2026-12-31'},
  salaryCl:{}
};
let S=DEMO?structuredClone(DEFAULT):(()=>{try{const s=localStorage.getItem(SK);if(!s)return structuredClone(DEFAULT);return{...structuredClone(DEFAULT),...JSON.parse(s)};}catch{return structuredClone(DEFAULT);}})();
function save(){localStorage.setItem(SK,JSON.stringify(S));}
function setState(patch){S={...S,...patch};save();render();}
function setProfile(patch){S={...S,profile:{...S.profile,...patch}};save();render();}
function resetData(){if(confirm('모든 데이터를 초기화할까요?')){localStorage.removeItem(SK);S=structuredClone(DEFAULT);render();}}

// ── CALC FUNCTIONS ────────────────────────────────────────────
function parseD(s){return new Date(s);}
function daysBetween(a,b){return Math.max(0,Math.floor((parseD(b)-parseD(a))/(864e5)));}
function monthsBetween(a,b){const da=parseD(a),db=parseD(b);return Math.max(0,(db.getFullYear()-da.getFullYear())*12+(db.getMonth()-da.getMonth()));}
function fmt(v){return Math.round(Number(v)||0).toLocaleString('ko-KR')+'원';}
function fmtN(v){return (Math.round(Number(v)||0)).toLocaleString('ko-KR');}

function leaveEntitlement(joinDate,asOf=TODAY){
  const mo=monthsBetween(joinDate,asOf);
  const yr=Math.floor(mo/12);
  if(mo<12) return Math.min(mo,11);
  if(yr<3) return 15;
  return Math.min(15+Math.floor((yr-1)/2),25);
}

function dailyWage(monthlySalary){return Math.round((Number(monthlySalary)||0)/21.67);}
function leaveAllowance(days,monthlySalary){return Math.round(days*dailyWage(monthlySalary));}

function severancePay(joinDate,leaveDate,monthlySalary){
  const days=daysBetween(joinDate,leaveDate);
  if(days<365) return 0;
  return Math.round(Math.round((Number(monthlySalary)||0)/30)*30*(days/365));
}

function lastSalary(leaveDate,monthlySalary){
  const d=parseD(leaveDate);
  const dInMonth=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return Math.round((Number(monthlySalary)||0)*(d.getDate()/dInMonth));
}

function fourInsurance(monthlySalary){
  const sal=Number(monthlySalary)||0;
  const pension=Math.round(sal*0.045);
  const health=Math.round(sal*0.03545);
  const ltc=Math.round(health*0.1295);
  const employment=Math.round(sal*0.009);
  return {pension,health,ltc,employment,total:pension+health+ltc+employment};
}

function daysUntilSalary(salaryDay){
  const today=parseD(TODAY);const sd=Number(salaryDay)||25;
  let target=new Date(today.getFullYear(),today.getMonth(),sd);
  if(target<=today) target=new Date(today.getFullYear(),today.getMonth()+1,sd);
  return Math.ceil((target-today)/864e5);
}

function nextLeaveIncrease(joinDate,asOf=TODAY){
  const mo=monthsBetween(joinDate,asOf);
  const yr=Math.floor(mo/12);
  if(mo<12){
    const d=parseD(joinDate);const next=new Date(d.getFullYear(),d.getMonth()+(mo+1),d.getDate());
    return {date:next.toISOString().slice(0,7),days:leaveEntitlement(joinDate,asOf)+1};}
  if(yr<3){
    const d=parseD(joinDate);const next=new Date(d.getFullYear()+3,d.getMonth(),d.getDate());
    return {date:next.toISOString().slice(0,7),days:16};}
  const nextOdd=yr%2===1?yr+2:yr+1;
  const d=parseD(joinDate);const next=new Date(d.getFullYear()+nextOdd,d.getMonth(),d.getDate());
  return {date:next.toISOString().slice(0,7),days:Math.min(15+Math.floor(nextOdd/2),25)};
}

// ── RENDER ────────────────────────────────────────────────────
function prog(pct,cls='purple'){return `<div class="prog"><div class="prog-fill ${cls}" style="width:${Math.max(3,Math.min(100,pct))}%"></div></div>`;}

function renderHome(){
  const p=S.profile;
  const totalLeave=leaveEntitlement(p.joinDate);
  const remain=Math.max(0,totalLeave-(Number(p.usedLeaveDays)||0));
  const leaveAmt=leaveAllowance(remain,p.monthlySalary);
  const sevPay=severancePay(p.joinDate,p.plannedLeaveDate||TODAY,p.monthlySalary);
  const ins=fourInsurance(p.monthlySalary);
  const netSal=p.hasFourInsurance?(Number(p.monthlySalary)-ins.total):Number(p.monthlySalary);
  const untilSalary=daysUntilSalary(p.salaryDay);
  const workingMonths=monthsBetween(p.joinDate,TODAY);
  const checkedCnt=Object.values(S.salaryCl).filter(Boolean).length;
  return `
    <div class="hero-card">
      <div class="eyebrow">내 근로 현황 요약</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;">
        <div><div style="font-size:11px;color:rgba(255,255,255,.7);">실수령 월급</div><div style="font-size:22px;font-weight:800;color:#FFF;">${fmtN(netSal)}</div><div style="font-size:10px;color:rgba(255,255,255,.6);">원</div></div>
        <div><div style="font-size:11px;color:rgba(255,255,255,.7);">급여일까지</div><div style="font-size:22px;font-weight:800;color:#FFF;">${untilSalary}</div><div style="font-size:10px;color:rgba(255,255,255,.6);">일</div></div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-cell"><div class="num">${remain}일</div><div class="label">잔여 연차</div></div>
      <div class="stat-cell"><div class="num">${workingMonths}개월</div><div class="label">근속</div></div>
      <div class="stat-cell"><div class="num">${checkedCnt}/${SALARY_CL.length}</div><div class="label">급여 점검</div></div>
    </div>
    ${remain>=5?`<div class="warn-card"><div class="wt">⚡ 연차 ${remain}일 남아있어요</div><p>지금 소진하면 약 ${fmt(leaveAmt)} 절약 가능. 퇴사 전 사용하는 것이 유리합니다.</p></div>`:''}
    ${sevPay>0?`<div class="card card-sm"><div class="eyebrow">퇴직금 예상 (${p.plannedLeaveDate})</div><div class="grad-num">${fmt(sevPay)}</div><p style="font-size:12px;color:var(--muted);">계속근로 ${Math.floor(daysBetween(p.joinDate,p.plannedLeaveDate||TODAY)/365)}년 기준 추정. 세금 공제 전 금액.</p></div>`:''}
    <div class="card card-sm" style="cursor:pointer;" onclick="setState({tab:'salary'})">
      <div class="sect-title"><h2>급여 점검</h2><span class="pill ${checkedCnt===SALARY_CL.length?'pill-green':'pill-amber'}">${checkedCnt===SALARY_CL.length?'✓ 완료':'진행 중'}</span></div>
      ${prog(checkedCnt/SALARY_CL.length*100,checkedCnt===SALARY_CL.length?'green':'amber')}
      <p style="font-size:12px;color:var(--muted);">급여명세서 항목을 꼼꼼히 점검하세요 →</p>
    </div>
    <div class="card card-sm" onclick="setState({tab:'resign'})" style="cursor:pointer;">
      <div class="eyebrow">퇴사 계산기</div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:13px;font-weight:600;">마지막 달 수령 예상</div>
        <div style="font-size:16px;font-weight:800;color:var(--purple);">${fmt(lastSalary(p.plannedLeaveDate||TODAY,p.monthlySalary)+leaveAllowance(remain,p.monthlySalary))}</div>
      </div>
      <p style="font-size:11px;color:var(--muted);margin-top:4px;">일할 급여 + 잔여 연차수당 합산 →</p>
    </div>`;
}

function renderLeave(){
  const p=S.profile;
  const total=leaveEntitlement(p.joinDate);
  const used=Number(p.usedLeaveDays)||0;
  const remain=Math.max(0,total-used);
  const allowance=leaveAllowance(remain,p.monthlySalary);
  const daily=dailyWage(p.monthlySalary);
  const next=nextLeaveIncrease(p.joinDate);
  const yr=Math.floor(monthsBetween(p.joinDate,TODAY)/12);
  return `
    <div class="hero-card">
      <div class="eyebrow">잔여 연차</div>
      <div class="big-num">${remain}일</div>
      <div class="sub">총 ${total}일 중 ${used}일 사용 · 지금 소진 시 ${fmt(allowance)}</div>
    </div>
    <div class="card">
      <div class="sect-title"><h2>연차 사용 현황</h2></div>
      ${prog(used/Math.max(1,total)*100,'purple')}
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px;">
        <span>사용 ${used}일</span><span>잔여 ${remain}일</span><span>총 ${total}일</span>
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">연차수당 계산</div>
      <table class="calc-table">
        <tr><td>일급 (월급 ÷ 21.67)</td><td>${fmt(daily)}</td></tr>
        <tr><td>잔여 연차일</td><td>${remain}일</td></tr>
        <tr class="total-row"><td>예상 연차수당</td><td>${fmt(allowance)}</td></tr>
      </table>
      <div class="notice">연차수당은 퇴직 시 지급이 원칙이며, 일부 회사는 회계연도 기준으로 정산합니다.</div>
    </div>
    <div class="card">
      <div class="eyebrow">연차 부여 기준 (근로기준법)</div>
      <div class="timeline">
        <div class="tl-item"><div class="tl-dot ${yr<1?'active':''}"></div><strong>1년 미만</strong><p>월 1일씩 발생, 최대 11일 (${yr<1?`현재 여기 — ${total}일`:total+'일 완료'})</p></div>
        <div class="tl-item"><div class="tl-dot ${yr>=1&&yr<3?'active':''}"></div><strong>1~2년</strong><p>연 15일 기본 부여</p></div>
        <div class="tl-item"><div class="tl-dot ${yr>=3&&yr<5?'active':''}"></div><strong>3년 이상</strong><p>2년마다 +1일 가산 (최대 25일)</p></div>
        <div class="tl-item"><div class="tl-dot"></div><strong>10년 이상</strong><p>최대 25일 도달</p></div>
      </div>
      ${next?`<div class="notice">다음 연차 증가: <strong>${next.date}</strong> → <strong>${next.days}일</strong>로 변경 예정</div>`:''}
    </div>
    <div class="card card-sm">
      <div class="eyebrow">내 연차 정보 수정</div>
      <div class="field" style="margin-top:10px;"><label>입사일</label><input type="date" id="joinDate-l" value="${p.joinDate}" onchange="setProfile({joinDate:this.value})"></div>
      <div class="field"><label>사용한 연차일</label><input type="number" id="usedLeave" value="${used}" min="0" onchange="setProfile({usedLeaveDays:Number(this.value)})"></div>
      <div class="field"><label>세전 월급 (원)</label><input type="number" id="sal-l" value="${p.monthlySalary}" onchange="setProfile({monthlySalary:Number(this.value)})"></div>
    </div>`;
}

function renderSalary(){
  const p=S.profile;
  const ins=fourInsurance(p.monthlySalary);
  const net=p.hasFourInsurance?(Number(p.monthlySalary)-ins.total):Number(p.monthlySalary);
  const checked=S.salaryCl;
  const done=SALARY_CL.filter(i=>checked[i.id]).length;
  return `
    <div class="card">
      <div class="eyebrow">4대보험 자동 계산</div>
      <div class="grad-num">${fmt(Number(p.monthlySalary)||0)}</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">세전 월급</div>
      <div class="ins-row"><span>국민연금 (4.5%)</span><strong>${fmt(ins.pension)}</strong></div>
      <div class="ins-row"><span>건강보험 (3.545%)</span><strong>${fmt(ins.health)}</strong></div>
      <div class="ins-row"><span>장기요양보험 (건보의 12.95%)</span><strong>${fmt(ins.ltc)}</strong></div>
      <div class="ins-row"><span>고용보험 (0.9%)</span><strong>${fmt(ins.employment)}</strong></div>
      <div class="ins-total"><span>총 공제액</span><strong>${fmt(ins.total)}</strong></div>
      <div style="margin-top:12px;background:rgba(139,92,246,.1);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;justify-content:space-between;">
        <span style="font-size:13px;font-weight:600;">예상 실수령액</span>
        <span style="font-size:16px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">${fmt(net)}</span>
      </div>
    </div>
    <div class="card">
      <div class="sect-title"><h2>급여 점검 체크리스트</h2><span class="pill ${done===SALARY_CL.length?'pill-green':'pill-amber'}">${done}/${SALARY_CL.length}</span></div>
      ${prog(done/SALARY_CL.length*100,done===SALARY_CL.length?'green':'amber')}
      <div style="margin-top:12px;">
        ${SALARY_CL.map(item=>`
          <label class="cl-item ${checked[item.id]?'checked':''}">
            <input type="checkbox" data-scl="${item.id}" ${checked[item.id]?'checked':''}>
            <div><strong>${item.title}</strong><p>${item.desc}</p></div>
          </label>`).join('')}
      </div>
    </div>
    <div class="card card-sm">
      <div class="eyebrow">월급 정보 수정</div>
      <div class="field" style="margin-top:10px;"><label>세전 월급 (원)</label><input type="number" id="sal-s" value="${p.monthlySalary}" onchange="setProfile({monthlySalary:Number(this.value)})"></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;" onclick="setProfile({hasFourInsurance:!S.profile.hasFourInsurance})">
        <input type="checkbox" ${p.hasFourInsurance?'checked':''} style="accent-color:var(--purple);width:16px;height:16px;" readonly> 4대보험 가입
      </div>
    </div>`;
}

function renderResign(){
  const p=S.profile;
  const leaveDate=p.plannedLeaveDate||TODAY;
  const totalLeave=leaveEntitlement(p.joinDate);
  const remain=Math.max(0,totalLeave-(Number(p.usedLeaveDays)||0));
  const sev=severancePay(p.joinDate,leaveDate,p.monthlySalary);
  const lastSal=lastSalary(leaveDate,p.monthlySalary);
  const leaveAmt=leaveAllowance(remain,p.monthlySalary);
  const ins=fourInsurance(p.monthlySalary);
  const netDeduct=p.hasFourInsurance?Math.round(ins.total*(parseD(leaveDate).getDate()/new Date(parseD(leaveDate).getFullYear(),parseD(leaveDate).getMonth()+1,0).getDate())):0;
  const total=lastSal+leaveAmt+sev;
  const days=daysBetween(p.joinDate,leaveDate);
  return `
    <div class="hero-card">
      <div class="eyebrow">마지막 달 수령 예상 (세전)</div>
      <div class="big-num">${fmt(total)}</div>
      <div class="sub">${leaveDate} 퇴사 기준 · 근속 ${Math.floor(days/365)}년 ${Math.floor((days%365)/30)}개월</div>
    </div>
    <div class="card">
      <div class="eyebrow">항목별 정산</div>
      <table class="calc-table">
        <tr><td>일할 급여 (${parseD(leaveDate).getDate()}일 근무)</td><td>${fmt(lastSal)}</td></tr>
        <tr><td>잔여 연차수당 (${remain}일)</td><td>${fmt(leaveAmt)}</td></tr>
        <tr><td>4대보험 공제 (일할)</td><td>-${fmt(netDeduct)}</td></tr>
        <tr class="total-row"><td>퇴직 월 실수령 예상</td><td>${fmt(Math.max(0,lastSal+leaveAmt-netDeduct))}</td></tr>
      </table>
    </div>
    <div class="card">
      <div class="eyebrow">퇴직금 계산</div>
      ${days<365?`<div class="warn-card"><div class="wt">⚠️ 퇴직금 미지급 대상</div><p>근속 1년 미만이면 퇴직금이 발생하지 않습니다. 현재 ${Math.floor(days/30)}개월 근무.</p></div>`:
      `<div class="grad-num">${fmt(sev)}</div>
       <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">근속 ${Math.floor(days/365)}년 기준 (세전)</p>
       <div class="notice">퇴직금은 퇴사 후 14일 이내 지급이 의무입니다. 미지급 시 노동청 신고 가능.</div>`}
    </div>
    <div class="card">
      <div class="eyebrow">퇴사 전 실수방지 체크</div>
      ${[
        {warn:true,t:'퇴사 날짜 선택 주의',d:'월 마지막 날 퇴사 시 그 달 4대보험 전액 본인 부담. 1일~말일-1일 퇴사 고려.'},
        {warn:false,t:'연차 소진 후 퇴사',d:`잔여 ${remain}일 소진 시 ${fmt(leaveAmt)} 절약 가능.`},
        {warn:true,t:'퇴직금 IRP 계좌 준비',d:'퇴직금은 IRP(개인형퇴직연금) 계좌로만 수령 가능. 미리 개설하세요.'},
        {warn:false,t:'건강보험 지역가입자 전환',d:'퇴사 후 직장가입자에서 지역가입자로 자동 전환. 임의계속가입 고려.'},
        {warn:false,t:'실업급여 요건 확인',d:'비자발적 퇴사 & 180일 이상 고용보험 납부 시 신청 가능.'}
      ].map(i=>`<div class="${i.warn?'warn-card':'danger-card'}" style="${i.warn?'':'border-left-color:var(--green);background:rgba(16,185,129,.08);'}">
        <div class="wt" style="${i.warn?'':'color:var(--green);'}">${i.warn?'⚠️':'✅'} ${i.t}</div>
        <p>${i.d}</p></div>`).join('')}
    </div>
    <div class="card card-sm">
      <div class="eyebrow">퇴사 예정일 설정</div>
      <div class="field" style="margin-top:10px;"><label>퇴사 예정일</label><input type="date" id="leaveDate" value="${leaveDate}" onchange="setProfile({plannedLeaveDate:this.value})"></div>
    </div>`;
}

function renderProfile(){
  const p=S.profile;
  return `
    <div class="card">
      <div class="sect-title"><h2>내 근무 정보</h2></div>
      <div class="field"><label>입사일</label><input type="date" id="pf-join" value="${p.joinDate}" onchange="setProfile({joinDate:this.value})"></div>
      <div class="field"><label>세전 월 기본급 (원)</label><input type="number" id="pf-sal" value="${p.monthlySalary}" onchange="setProfile({monthlySalary:Number(this.value)})"></div>
      <div class="field"><label>급여일 (매월 X일)</label><input type="number" id="pf-sd" value="${p.salaryDay}" min="1" max="31" onchange="setProfile({salaryDay:Number(this.value)})"></div>
      <div class="field"><label>사용한 연차 (일)</label><input type="number" id="pf-used" value="${p.usedLeaveDays}" min="0" onchange="setProfile({usedLeaveDays:Number(this.value)})"></div>
      <div class="field"><label>퇴사 예정일</label><input type="date" id="pf-leave" value="${p.plannedLeaveDate||''}" onchange="setProfile({plannedLeaveDate:this.value})"></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 0;" onclick="setProfile({hasFourInsurance:!S.profile.hasFourInsurance})">
        <input type="checkbox" ${p.hasFourInsurance?'checked':''} style="accent-color:var(--purple);width:18px;height:18px;" readonly> 4대보험 가입 중
      </div>
    </div>
    <div class="card">
      <div class="eyebrow">현재 상태 요약</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
        ${[
          {l:'근속',v:monthsBetween(p.joinDate,TODAY)+'개월'},
          {l:'연차 부여',v:leaveEntitlement(p.joinDate)+'일'},
          {l:'잔여 연차',v:Math.max(0,leaveEntitlement(p.joinDate)-(Number(p.usedLeaveDays)||0))+'일'},
          {l:'일급',v:fmt(dailyWage(p.monthlySalary))}
        ].map(s=>`<div style="background:var(--surface2);border-radius:10px;padding:10px;"><div style="font-size:10px;color:var(--muted);">${s.l}</div><div style="font-size:16px;font-weight:700;color:var(--text);margin-top:3px;">${s.v}</div></div>`).join('')}
      </div>
    </div>
    <div class="card card-sm">
      <div class="notice">⚠️ 이 계산기는 참고용 도구입니다. 실제 연차·퇴직금·급여는 근로계약서, 취업규칙, 노동부 기준에 따라 달라질 수 있습니다.</div>
      <button class="btn-outline" onclick="resetData()">데이터 초기화</button>
    </div>`;
}

const TABS=[
  {id:'home',icon:'🏠',label:'홈'},
  {id:'leave',icon:'📅',label:'연차'},
  {id:'salary',icon:'💸',label:'급여'},
  {id:'resign',icon:'🚪',label:'퇴사'},
  {id:'profile',icon:'👤',label:'내 정보'}
];

function render(){
  document.getElementById('bottomnav').innerHTML=TABS.map(t=>`
    <button class="nav-btn ${S.tab===t.id?'active':''}" onclick="setState({tab:'${t.id}'})">
      <span class="icon">${t.icon}</span>${t.label}
    </button>`).join('');
  const content={home:renderHome,leave:renderLeave,salary:renderSalary,resign:renderResign,profile:renderProfile}[S.tab]?.()??renderHome();
  document.getElementById('content').innerHTML=content;
  document.getElementById('content').scrollTop=0;
  bindEvents();
}

function bindEvents(){
  document.querySelectorAll('[data-scl]').forEach(el=>{
    el.addEventListener('change',()=>{
      const scl={...S.salaryCl,[el.dataset.scl]:el.checked};
      setState({salaryCl:scl});
    });
  });
}

render();
</script>
</body>
</html>
