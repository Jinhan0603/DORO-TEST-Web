<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DORO 결과물 포털</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #F97316;
      --orange-dark: #EA580C;
      --orange-light: #FFF7ED;
      --bg: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-primary: #111827;
      --text-secondary: #6B7280;
      --text-muted: #9CA3AF;
      --border: #E5E7EB;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-hover: 0 10px 25px rgba(249,115,22,0.15), 0 4px 6px rgba(0,0,0,0.05);
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, #1C1917 0%, #292524 50%, #1C1917 100%);
      padding: 56px 24px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(249,115,22,0.18) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 20%, rgba(249,115,22,0.10) 0%, transparent 50%);
    }
    .hero-inner { position: relative; max-width: 800px; margin: 0 auto; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.35);
      color: #FB923C; font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 5px 14px; border-radius: 999px;
      margin-bottom: 18px;
    }
    .hero-badge span { width: 6px; height: 6px; background: #F97316; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .hero h1 {
      font-size: clamp(28px, 5vw, 48px); font-weight: 900;
      color: #FFFFFF; line-height: 1.2; margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    .hero h1 em { color: var(--orange); font-style: normal; }
    .hero p { color: #A8A29E; font-size: 15px; line-height: 1.7; }

    .stats-row {
      display: flex; justify-content: center; gap: 32px; margin-top: 32px;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 28px; font-weight: 900; color: #FFFFFF; }
    .stat-num em { color: var(--orange); font-style: normal; }
    .stat-label { font-size: 11px; color: #78716C; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }

    /* ── MAIN ── */
    .main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── SEARCH + FILTER ── */
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 28px; }
    .search-wrap { flex: 1; min-width: 220px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 11px 16px 11px 42px;
      border: 1.5px solid var(--border); border-radius: 12px;
      background: white; font-size: 14px; font-family: inherit;
      color: var(--text-primary); outline: none; transition: border .2s;
    }
    .search-wrap input:focus { border-color: var(--orange); }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-tab {
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 500;
      border: 1.5px solid var(--border); background: white; color: var(--text-secondary);
      cursor: pointer; transition: all .15s; white-space: nowrap; font-family: inherit;
    }
    .filter-tab:hover { border-color: var(--orange); color: var(--orange); }
    .filter-tab.active { background: var(--orange); border-color: var(--orange); color: white; }
    .filter-tab .cnt {
      display: inline-block; background: rgba(0,0,0,0.1); border-radius: 99px;
      padding: 1px 7px; font-size: 11px; margin-left: 4px;
    }
    .filter-tab.active .cnt { background: rgba(255,255,255,0.25); }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; font-weight: 700; color: var(--text-secondary);
      letter-spacing: 0.08em; text-transform: uppercase;
      margin: 32px 0 16px;
    }
    .section-header::before {
      content: ''; display: block; width: 3px; height: 16px;
      background: var(--orange); border-radius: 2px;
    }
    .section-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── GRID ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    /* ── CARD ── */
    .card {
      background: var(--card-bg); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
      text-decoration: none; color: inherit;
      transition: border-color .2s, box-shadow .2s, transform .2s;
      box-shadow: var(--shadow);
      position: relative; overflow: hidden;
    }
    .card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--orange-light), transparent);
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .card:hover { border-color: var(--orange); box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .card:hover::after { opacity: 1; }

    .card-top { display: flex; align-items: flex-start; gap: 12px; }
    .card-icon {
      width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .card-meta { flex: 1; min-width: 0; }
    .card-category {
      font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 4px; display: inline-block; margin-bottom: 4px;
    }
    .card h3 {
      font-size: 15px; font-weight: 700; line-height: 1.35;
      color: var(--text-primary); transition: color .15s;
    }
    .card:hover h3 { color: var(--orange-dark); }
    .card-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .card-filename {
      font-size: 10.5px; color: var(--text-muted); font-family: 'Courier New', monospace;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;
    }
    .card-arrow {
      width: 28px; height: 28px; border-radius: 8px;
      background: var(--orange-light); color: var(--orange);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s; flex-shrink: 0;
    }
    .card:hover .card-arrow { background: var(--orange); color: white; }

    /* ── CATEGORY COLOURS ── */
    .cat-ai    { background:#EFF6FF; color:#3B82F6; } .icon-ai    { background:#EFF6FF; }
    .cat-biz   { background:#F0FDF4; color:#16A34A; } .icon-biz   { background:#F0FDF4; }
    .cat-edu   { background:#FFF7ED; color:#EA580C; } .icon-edu   { background:#FFF7ED; }
    .cat-road  { background:#F5F3FF; color:#7C3AED; } .icon-road  { background:#F5F3FF; }
    .cat-collab{ background:#FDF4FF; color:#A21CAF; } .icon-collab{ background:#FDF4FF; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty svg { margin: 0 auto 12px; opacity: .4; }

    /* ── FOOTER ── */
    footer {
      text-align: center; padding: 24px;
      border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12px;
    }

    /* ── HIDDEN ── */
    [data-hidden] { display: none !important; }
  </style>
</head>

const SECTIONS = [
  { cat: 'ai',    label: 'AI · 컨설팅' },
  { cat: 'biz',   label: '사업 · 전략' },
  { cat: 'edu',   label: '교육 프로그램' },
  { cat: 'road',  label: 'Open Road' },
  { cat: 'collab',label: '산학연 · 협력' },
];

function renderCards(filter = 'all', query = '') {
  const q = query.trim().toLowerCase();
  const root = document.getElementById('cards-root');
  root.innerHTML = '';
  let totalVisible = 0;

  SECTIONS.forEach(({ cat, label }) => {
    if (filter !== 'all' && filter !== cat) return;
    const items = ITEMS.filter(it => {
      if (it.cat !== cat) return false;
      if (!q) return true;
      return (it.title + it.desc + it.file + it.catLabel).toLowerCase().includes(q);
    });
    if (!items.length) return;
    totalVisible += items.length;

    const sec = document.createElement('div');
    sec.innerHTML = `<div class="section-header">${label}</div>`;
    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(it => {
      grid.innerHTML += `
        <a href="${it.file}" class="card" data-cat="${it.cat}">
          <div class="card-top">
            <div class="card-icon ${it.iconCls}">${it.icon}</div>
            <div class="card-meta">
              <span class="card-category ${it.catCls}">${it.catLabel}</span>
              <h3>${it.title}</h3>
            </div>
          </div>
          <p class="card-desc">${it.desc}</p>
          <div class="card-footer">
            <span class="card-filename">${it.file}</span>
            <span class="card-arrow">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
              </svg>
            </span>
          </div>
        </a>`;
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });

  const empty = document.getElementById('empty-state');
  if (totalVisible === 0) {
    empty.removeAttribute('data-hidden');
  } else {
    empty.setAttribute('data-hidden', '');
  }
}

// Filter tabs
let activeFilter = 'all';
let activeQuery = '';

document.querySelectorAll('.filter-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.cat;
    renderCards(activeFilter, activeQuery);
  });
});
