      <stop offset="0%" stop-color="#203a36" />
      <stop offset="100%" stop-color="#324944" />
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="36" fill="url(#bg)" />
  <rect x="40" y="40" width="1120" height="680" rx="30" fill="#f5efe5" />
