    <text x="478" y="382" fill="#172127" font-size="24" font-weight="700">Business meetings</text>

    <rect x="802" y="244" width="316" height="156" rx="28" fill="#ffffff" stroke="#d8cab7" />
    <text x="838" y="292" fill="#a4693f" font-size="16" font-weight="700">CES 2026</text>
