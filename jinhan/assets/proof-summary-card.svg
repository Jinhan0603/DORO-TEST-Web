<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Validation and Commercialization Summary</title>
  <desc id="desc">Document-style summary card showing CES outcomes and validation signals.</desc>
  <defs>
